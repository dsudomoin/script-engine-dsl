migration {
  # Какую миграцию запускать. Значение по умолчанию перекрывается переменной окружения.
  run = CUSTOMER-TIER-001
  run = ${?MIGRATION_RUN}

  # Репетиция без записей. Подстановку нужно писать явно: Kora читает окружение только через
  # ${?VAR}, никакого неявного чтения env в библиотеке нет. Без этой строки
  # MIGRATION_DRY_RUN=true спокойно ушла бы в бой.
  dryRun = false
  dryRun = ${?MIGRATION_DRY_RUN}

  # Без ключа артефакты легли бы в logs/<имя миграции> относительно рабочей директории.
  outputFolder = "build/example-output/run"
  outputFolder = ${?MIGRATION_OUTPUT_FOLDER}

  defaults {
    progressEvery = 100
    errorThreshold = 10
  }
}
